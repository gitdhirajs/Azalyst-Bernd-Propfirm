# Blueprint Trading Dashboard Configuration -- Azalyst Propfirm edition
# ==========================================

# ============================================================
# FUNDINGPIPS 2-STEP PRO CHALLENGE -- $5,000 account (Phase 1)
# ============================================================
# 2026-07-13: switched from 1-Step to 2-Step Pro after the 1-Step account was
# lost to an unexpected daily-loss breach. Confirmed on fundingpips.com/trading-objectives:
# 2-Step Pro uses the SAME 3%/6% daily/total loss limits as the old 1-Step, so
# max_daily_loss_usd/max_total_loss_usd below are UNCHANGED. What changes is the
# profit target: two phases of 6% each (not one phase of 10%), unlimited time on both.
#   Account #2015868, MatchTrader. FP dashboard shows INR (~90:1 display
#   conversion of the USD figures) -- everything here is configured in USD.
#
#   Account size ........ $5,000
#   Max daily loss ...... $150   (3% of 5,000)   -> Rs 13,500 on the FP panel
#   Max total loss ...... $300   (6% static)     -> Rs 27,000 on the FP panel
#   Phase 1 target ...... $300   (6%)            -> Rs 27,000 on the FP panel
#   Phase 2 target ...... $300   (6%, same $ from the new phase-1 balance)
#   Min trading days .... none stated per-phase (unlimited time)
#
# When enabled, the paper trader blocks any trade that would breach the
# daily or total loss cap at submit time -- exactly what the broker does.
# Daily window resets at daily_reset_hour_utc (confirm against the
# "Resets In" countdown on your FP dashboard and adjust if it differs).
# Profit target is informational only (no enforcement) -- the engine blocks
# trades on a loss-cap breach, not on profit-target attainment.
#   Phase 1 (now):     profit_target_pct: 6.0    <-- 2-Step Pro phase-1 target ($300)
#   Funded (passed):   profit_target_pct: 0.0    (no target)
# NOTE: after you pass, update account_size + both caps to your funded size.
# ------------------------------------------------------------
prop_firm:
  enabled: true
  account_size: 5000.0
  max_daily_loss_usd: 150.0      # 3% of 5,000  = FP "Maximum Daily Loss" (Rs 13,500)
  max_total_loss_usd: 300.0      # 6% static     = FP "Maximum Loss"       (Rs 27,000)
  profit_target_pct: 6.0         # 2-Step Pro phase-1 target = 6% ($300 / Rs 27,000)
  daily_reset_hour_utc: 22       # 17:00 NY = 22:00 UTC. Confirm vs FP "Resets In" timer.

risk:
  # Used as fallback when prop_firm.enabled is false. When prop_firm is on,
  # `prop_firm.account_size` overrides account_balance for the paper trader.
  account_balance: 5000.0
  risk_per_trade_pct: 1.0          # 1% = $50 risk per trade on $5,000 (user decision 2026-09-27)
  reduced_risk_pct: 0.5            # Counter-trend & anticipatory: 0.5% = $25 (HAI Module 4)
  # Hard ceiling per trade. When the 1% budget rounds below the broker's minimum
  # lot (e.g. gold with a $60 stop: 0.01 lot = $60 = 1.2%), the minimum lot is
  # taken only while its risk stays <= this; a wider stop is skipped instead.
  # Before 2026-09-27 such a trade got 0 lots and silently vanished.
  max_risk_per_trade_pct: 1.5
  max_daily_loss_pct: 3.0          # 2-Step Pro daily cap (matches prop_firm.max_daily_loss_usd)
  max_total_loss_pct: 6.0          # 2-Step Pro static total cap (matches prop_firm.max_total_loss_usd)
  # 2026-07-13: user lost the prior 1-Step account to an unexpected daily-loss
  # breach. 1%-of-account risk sizing produces a VARIABLE lot size per trade
  # (wider stop = smaller lot, tighter stop = bigger lot), and several 1%
  # trades stacking same-day can chew through the 3% daily cap fast. Until a
  # trade is closed profitably, every signal (TAKE and CAUTION alike) is
  # forced to the platform's MINIMUM lot (0.01 -- confirmed on FundingPips
  # MatchTrader across FX/metals/indices/crypto, 2026-07-13) instead of the
  # risk_per_trade_pct calculation. This caps worst-case single-trade risk at
  # whatever 0.01 lot's stop-distance works out to (a few dollars), nowhere
  # near the $150 daily limit.
  # To size up: bump fixed_lot_multiplier (1 = 0.01 "1 lot", 2 = 0.02 "2 lot",
  # etc.) only AFTER you've closed at least one trade in profit on this
  # challenge. Set fixed_lot_mode: false to go back to full 1%-risk sizing.
  #
  # 2026-09-27 -- fixed_lot_mode OFF, 1% risk per trade (user decision; a fresh
  # $5k challenge starts on deploy, together with the execution fixes: 1h bar
  # replay, no fill at signal time, stop orders for pattern entries). Under the
  # fixed 0.01 lot the dollar risk depended on the instrument, not on the plan:
  # the last live history shows NZDUSD risking $4.33 while a BTC order risked
  # $51.55 at the same "size". Stacking stays capped by the aggregate open-risk
  # check below: realized-today + open risk + new risk must stay UNDER $150, so
  # about two unprotected 1% trades can be live at once (three full $50 risks
  # reach $150 and the third is refused until one is at breakeven or closed),
  # plus the correlation gate. Single-trade risk is capped at
  # max_risk_per_trade_pct.
  fixed_lot_mode: false
  fixed_lot_multiplier: 1.0
  # Cap removed (user request 2026-07-13): after a week live, max_open_positions=1
  # meant a single position occupied the only slot for 6 days and blocked every
  # other signal, producing zero track record. Raised to effectively unlimited so
  # every qualifying signal (>= alerts.min_composite_to_alert) gets paper-traded.
  # NOTE (2026-07-27 audit correction): the comment below previously claimed the
  # aggregate-open-risk check was "the REAL safety cap" -- that was only true for
  # orders that fill immediately. Since Phase 44 (2026-06-19) made nearly every
  # signal start as a PENDING limit order, and check_pending_fills() promoted
  # PENDING -> ACTIVE with ZERO re-check of this cap or of correlation, the
  # account had accumulated 22 concurrently open positions (8 of them long-EUR/
  # short-USD simultaneously) by 2026-07-27, none of it caught by this gate.
  # Fixed: check_pending_fills() now re-validates max_open_positions + the loss
  # budget + correlation at the moment a pending order actually fills, and
  # correlation is also checked at submit time (see correlation_check_enabled
  # below). The aggregate-open-risk check IS still real protection now that
  # it's actually applied at both submit AND fill time:
  #   (realized_today_loss + sum of open-position risk + this trade's risk)
  #   >= max_daily_loss_usd ($150)
  max_open_positions: 20
  # Correlation-aware exposure cap (Rule #12: "ALWAYS use uncorrelated positions
  # -- max 2-3"). RulesEngine.is_correlated_to_open() (HAI 1:19:29 + Funded
  # 0:16:46) existed since 2026-05-24 but was never called from anywhere --
  # confirmed dead code during the 2026-07-27 audit. Now wired into
  # BP_paper_trader.submit_signal() (both pending + immediate paths) and
  # re-checked in check_pending_fills() at fill time. Set false to disable.
  # Groups themselves are RulesEngine.DEFAULT_CORRELATED_GROUPS unless a
  # `correlated_groups:` list is added at the top level of this file.
  correlation_check_enabled: true
  # Resting PENDING limit orders used to sit forever (TradeStatus.CANCELLED was
  # defined but never assigned anywhere -- found live sitting 8-12 days stale on
  # 2026-07-27). Max age in calendar days before an unfilled order expires.
  # Flat number applies to every income_strategy; or a per-strategy dict:
  #   pending_order_max_age_days: {weekly: 14, daily: 5, monthly: 30, intraday: 2}
  pending_order_max_age_days: {weekly: 14, daily: 5, monthly: 30, intraday: 2}

# ============================================================
# ALERTS -- Discord signal quality filter + skip/take verdict
# ============================================================
# 2026-08-14: user wants NO scoring-based gate at all -- every signal the
# scanner produces is shown, @pinged, and paper-traded as [TAKE], regardless
# of composite score. Both bars set to 0.0 so nothing is ever hidden,
# downgraded, or skipped. The composite number is still computed and shown
# on each signal as an FYI stat, but it no longer filters anything.
# Env override: AZALYST_MIN_COMPOSITE
# ------------------------------------------------------------
alerts:
  min_composite_to_post: 0.0
  min_composite_to_alert: 0.0

# ============================================================
# INSTRUMENT SPECS -- used to turn a $ risk into a MatchTrader LOT SIZE
# ============================================================
# The alert must tell you the exact volume to type into FundingPips. That
# conversion needs each instrument's contract size:
#
#   lots = risk_usd / (stop_distance * usd_value_per_point_per_lot)
#
# FOREX is broker-INDEPENDENT: 1 lot = 100,000 base units and the per-point
# USD value is derived from the live rate, so those specs are `verified: true`.
#
# Everything else (metals, indices, energies, crypto) has a broker-specific
# contract size. The values below are the COMMON MatchTrader defaults but are
# flagged `verified: false` -- the alert prints a "CONFIRM on ticket" note for
# them. To verify: open the order ticket on FundingPips, read the contract
# size for that symbol, set it here, and flip `verified: true`.
# ------------------------------------------------------------
instrument_specs:
  # Values below are standard MatchTrader / CFD contract units (FundingPips runs
  # on MatchTrader). FundingPips' live spec page blocks automated reads, so the
  # STANDARDIZED full-lot commodity/crypto units (100 oz gold, 5000 oz silver,
  # 1000 bbl oil, 1 coin crypto) and the standard $1-per-point US index are set
  # verified:true. Broker-VARIABLE ones -- copper, natgas, refined products, and
  # all NON-USD indices (point value is in the index's LOCAL currency and needs
  # live FX conversion the sizer does not apply) -- stay verified:false so the
  # alert keeps its "confirm on ticket" note. Every alert ALSO prints "set
  # platform Risk Mode = 1%"; THAT is the authoritative sizing -- these values
  # are only a cross-check. Confirm metals + indices on one MatchTrader ticket.
  defaults_by_class:
    forex:           { contract_size: 100000, min_lot: 0.01, lot_step: 0.01, verified: true }
    precious_metals: { contract_size: 100,    min_lot: 0.01, lot_step: 0.01, verified: true }   # gold/platinum/palladium: 100 oz/lot
    energies:        { contract_size: 1000,   min_lot: 0.01, lot_step: 0.01, verified: false }  # WTI/Brent overridden below; natgas/refined vary
    equity_indices:  { contract_size: 1, point_value_per_lot: 1, min_lot: 0.1, lot_step: 0.1, verified: false }  # US overridden below; non-USD stay unverified (FX)
    commodities:     { contract_size: 1, point_value_per_lot: 1, min_lot: 0.01, lot_step: 0.01, verified: false }
    crypto:          { contract_size: 1, min_lot: 0.01, lot_step: 0.01, verified: true }   # 1 coin/lot ($1 move = $1/lot)
    equities:        { contract_size: 1, min_lot: 1, lot_step: 1, verified: true }
    interest_rates:  { contract_size: 1, point_value_per_lot: 1, min_lot: 0.1, lot_step: 0.1, verified: false }
  # Per-symbol overrides keyed by the broker `name` from the watchlist.
  overrides:
    # -- Precious metals (standard full-lot ounce units) --
    "XAGUSD (Silver)":     { contract_size: 5000, verified: true }    # 5000 oz/lot ($1 move = $5000/lot)
    "XCUUSD (Copper)":     { contract_size: 1000, verified: false }   # unit varies by broker -- confirm on ticket
    # -- Energies -- WTI/Brent are 1000 bbl/lot; natgas + refined products vary --
    "USOIL (WTI Crude)":   { contract_size: 1000, point_value_per_lot: 1000, verified: true }   # 1000 bbl/lot
    "UKOIL (Brent Crude)": { contract_size: 1000, point_value_per_lot: 1000, verified: true }   # 1000 bbl/lot
    "NATGAS (Natural Gas)":  { verified: false }   # 1 lot ~10,000 MMBtu on MatchTrader -- confirm on ticket
    "HEATOIL (Heating Oil)": { verified: false }   # priced $/gal, ~42,000 gal/lot -- confirm on ticket
    "GASOLINE (RBOB)":       { verified: false }   # priced $/gal, ~42,000 gal/lot -- confirm on ticket
    # -- US equity indices: MT5/MatchTrader standard = $1 per index point per lot.
    #    Keys MUST match the watchlist `name` EXACTLY. MT5-SIM1 live symbols
    #    (confirmed 2026-07-14): SPX500 / NDX100 / DJI30 (US500/US100/US30 do
    #    NOT exist on MT5). --
    "SPX500 (S&P 500)":    { point_value_per_lot: 1, verified: true }
    "NDX100 (Nasdaq 100)": { point_value_per_lot: 1, verified: true }
    "DJI30 (Dow Jones)":   { point_value_per_lot: 1, verified: true }
    "US2000 (Russell)":    { point_value_per_lot: 1, verified: true }
    # -- Non-USD indices (GER40/UK100/JP225/AUS200/HK50/FRA40/ESP35/EU50/SUI30):
    #    left on the class default (verified:false) -- point value is in the
    #    index's local currency; confirm + apply the FX conversion on the ticket.

# ============================================================
# STRATEGY -- which income-strategy timeframe(s) to scan
# ============================================================
# - active_strategy:   global default when a watchlist entry has no
#                      `strategies` field. The legacy single-pass mode.
# - default_strategies: list of strategies to scan PER SYMBOL when the
#                       entry has no override. Each name maps to an
#                       (HTF, LTF) pair via STRATEGY_TIMEFRAMES in
#                       run_scanner.py. For the FundingPips monthly
#                       competition we want BOTH 'weekly' (htf=1wk, ltf=1d)
#                       and 'daily' (htf=1d, ltf=60m) so we catch big
#                       swings AND short-hold daily setups.
# - Per-watchlist `strategies: [...]` field overrides this default.
#   Crypto entries are pinned to ['daily'] only -- weekly bars on crypto
#   are too few/volatile to be meaningful per the methodology audit.
# ------------------------------------------------------------
# ---------------------------------------------------------------------------
# rules — decision-layer switches (added 2026-08-21, FTW audit C-58/C-61/C-67)
# ---------------------------------------------------------------------------
rules:
  # C-58: the Phase-39 ZONE-ARRIVAL rule is asymmetric — the bullish branch has no
  # COT guard at all, while the bearish branch is guarded for forex only. Result:
  # Location alone could fire a long while our own COT read bearish.
  #
  # ENABLED 2026-08-21 on four independent measurements:
  #   Bernd lecture set, REVIEWED labels (n=75): OPPOSITE 6 (8%) -> 4 (5%),
  #                                              MATCH unchanged at 37 (49%)
  #   Bernd lecture set, original labels (n=85): OPPOSITE 12 -> 10, MATCH unchanged
  #   goldtest OOS suite (n=71):                 0 cases changed — NO regression
  #                                              (this is the check the Phase 37/40
  #                                              comment warned COT-widening had failed)
  #   non-Bernd signal rows (n=23):              0 cases changed
  # It converts exactly the two NG=F rows (2024-02-11, 2024-02-19) from
  # wrong-direction to 'hold'. On both, our own trend read 'downtrend' AND our own
  # COT read 'bearish' — agreeing with him — and zone-arrival fired bullish anyway.
  # Revert: set to false, or `git checkout -- BP_config.yaml`. Backup:
  # BP_config.yaml.bak-2026-08-21
  cot_blocks_zone_arrival: true

  # C-61 -> C-76: DROPPED on 2026-08-21, then ENABLED the same day when the TARGET
  # changed. Both decisions were correct against the goal they were measured on.
  #
  # Dropped when the goal was "match BERND": its only benefit came from 2024 Funded
  # Trader Signals rows, which C-60 proved are Clemens Winkler's trades, and on
  # Bernd's own index calls it costs one correct call (RTY=F 2023-06-03), fixing none.
  #
  # ENABLED when the goal became "match ALL THREE OTC traders" (Bernd + Jan
  # Skorupinski + Clemens Winkler) -- they run the same method and the same indicator
  # pack, so a correct implementation should agree with all three. Measured on the
  # 118-row combined ground truth:
  #    shipped   MATCH 58 (49%)  OPPOSITE 12 | Bernd 44/95  Jan 12/16  Clemens 2/7
  #    this flag MATCH 60 (51%)  OPPOSITE  9 | Bernd 43/95  Jan 12/16  Clemens 5/7
  # Converts three wrong-direction equity-index calls (NQ=F 2024-02-14,
  # YM=F 2024-01-03, YM=F 2024-02-14) into matches, costing one Bernd MATCH which
  # becomes a hold. Opposites lose money; holds do not.
  # Revert: set false, or restore BP_config.yaml.bak2-2026-08-21
  xcat_skip_equity_indices: true

  # C-72: the Phase 42 Fix-2 block prevented ANY bearish equity-index verdict during
  # pre-election years (all of 2023). Its stated premise -- "Bernd NEVER takes
  # equity-index short positions, 0 such calls in 160 goldtest" -- was absence of
  # evidence from a corpus with 14 chapters never read. Mining four of them produced
  # three 2023 index shorts in his own words, the clearest being YM=F 2023-09-16:
  # "we are moving from that supply area where price was at least overvalued ... head
  # and shoulders ... this is really falling apart. And I think it will fall apart."
  #
  # Natural experiment (same class, same detector, six months apart):
  #     blocked 2023 index shorts  -> 0/3 correct
  #     unblocked 2024 index shorts-> 2/2 correct
  #
  # ENABLED 2026-08-21 on explicit user approval. Measured:
  #   combined 118-row set : MATCH 60 -> 62 (53%), OPPOSITE 9, shorts 5/32 -> 7/32
  #   Bernd 95-row set     : +2 MATCH, 0 new opposites
  #   goldtest OOS back-to-back (noise floor 0, see C-74):
  #        bias_match 40 -> 40  (ZERO trade-level changes)
  #        bias_only  41 -> 40  (one Stage-1 view, ES=F 2023-04-24, on a date Bernd
  #                              was neutral; no trade fired under either setting)
  # Revert: set false, or restore BP_config.yaml.bak3-2026-08-21
  allow_prelection_index_shorts: true

  # C-83: let a MODERATE bearish COT propose the short, instead of deriving every
  # direction from location. Grounded in what the traders themselves cite -- their
  # SHORTS name COT 42% of the time while their LONGS name valuation (39%) and zone
  # (37%). Measured as predictors of their direction on the 133-row all-trader set:
  #     our_cot      bullish 26/27 (96%)   bearish 16/27 (59%)
  #     our_location bullish 43/51 (84%)   bearish 16/50 (32%)
  # The reliable signature is the MODERATE reading, not the extreme -- a 156-week COT
  # extreme predicts their direction only 5/14 (36%), because commercials are hedgers
  # and are early at extremes:
  #     cot=bearish + strength=normal + val!=bullish  ->  10/11 (91%)
  # This signature also BYPASSES the per-class short suppressions (PM, equity index),
  # which is the point: gold was being held by Phase 42 Fix-1. Note this does NOT
  # reopen C-79 -- unblocking PM shorts wholesale cost +6 wrong-direction calls, while
  # gating the bypass behind a 91%-accurate signature costs zero.
  #
  # MEASURED:
  #   133-row all-trader set : MATCH 73 -> 77 (58%), shorts 7/33 -> 11/33 (21% -> 33%)
  #                            4 rows changed, ALL gains, 0 losses, 0 new opposites,
  #                            longs untouched at 66/100
  #   goldtest OOS back-to-back (noise floor 0, C-74):
  #                            bias_match 40 -> 40  (ZERO trade-level changes)
  #                            bias_only  40 -> 38  (4 rows; 1 is a GAIN where the
  #                            goldtest itself labels USDCHF short, and 3 are
  #                            GROUND-TRUTH CONFLICTS where the goldtest says neutral
  #                            and the transcript-sourced label says bearish -- see
  #                            C-85. Not a code regression.)
  # Revert: set false, or restore BP_config.yaml.bak4-2026-08-21
  cot_proposes_short: true

active_strategy: "weekly"
default_strategies: ["weekly", "daily"]

