stop_loss:
  fibonacci_extension_pct: 33.0
  # Trade management. Read by BP_management.management_settings() -- the paper
  # trader, the Discord text and the charts all use that one reader.
  #
  # scale_out (user decision 2026-09-28, verbatim: "when 1r reach close 50%
  #   move to breakeven n then let 50% run till possible"):
  #   at +scale_out_at_r (1R of the PLANNED risk |entry - stop|, from the
  #   planned entry) close scale_out_fraction (50%) of the original size and
  #   move the stop to breakeven (the fill price) from the next bar. The runner
  #   then trails in whole-R steps (runner_trail: r_steps): peak +2R -> stop
  #   +1R, +3R -> +2R, ... and exits only on its stop, or at runner_target_r
  #   when set (null = no cap, "run till possible"). runner_trail: none = the
  #   runner rides at breakeven. A 50% at +1R + runner stopped at breakeven
  #   books +0.50R (a win).
  # fixed (2026-09-27): set-and-forget. The stop never moves and the whole
  #   position closes at take_profit_target (2 = T2 = 2R). REVERT to this with
  #   `management: fixed` (config only). Do NOT revert the scale-out CODE while
  #   an open position has a booked partial (booked_pnl > 0): older code books
  #   the partial a second time. Run research/unbook_partials.py first.
  # An unknown `management` value or nonsense scale_out numbers (fraction or
  #   at_r <= 0, fraction > 1, runner_target_r <= scale_out_at_r) fall back to
  #   `fixed` with an ERROR in the log and a [!] CONFIG line in the Discord footer.
  # ladder (pre-2026-09-27): breakeven (settings below), 50% at T2, trail, T3.
  management: scale_out
  scale_out_at_r: 1.0          # scale_out: partial trigger in R from the planned entry
  scale_out_fraction: 0.5      # scale_out: fraction of the ORIGINAL size closed at the trigger
  runner_trail: r_steps        # scale_out: r_steps | none
  runner_target_r: null        # scale_out: optional hard runner take-profit in R; null = no cap
  # scale_out: does a de-risked runner (50% off, stop at/beyond breakeven)
  # still count toward risk.max_open_positions and as a correlation peer?
  # true (default, unchanged) = yes, e.g. a EURUSD runner blocks GBPUSD until it
  # closes. false = a runner no longer blocks new entries. USER DECISION PENDING.
  runner_blocks_new_entries: true
  take_profit_target: 2        # fixed only: the one take-profit (T2 = 2R)
  breakeven_at_r: 1.0                # ladder only: BE at T1 (textbook)
  breakeven_at_half_target: false    # ladder only: BE at half-way to T1 (Bernd's live)
  partial_take_r: 2.0
  full_take_r: 3.0

# ============================================================
# ENTRY DISTANCE GATE -- Phase 46 (2026-06-23)
# ============================================================
# Phase 44 removed the in_zone gate so the engine fires E1 PENDING limit
# orders at zone proximal even when price is not yet there. Without a cap
# the live scanner flagged historical zones 30-60% away from current price
# (Silver entry 23.76 while spot 62.37, BTC entry 42k while spot 62k, etc.)
# Bernd places limit orders for zones price is approaching, not zones that
# are years away. We re-introduce a distance cap measured in R-multiples
# of the stop distance (= zone height + Fib extension), so the cap scales
# with each asset's volatility automatically.
#
#   pending signal allowed if  |close - entry| / |stop - entry|  <=  max_r
#
# Tuning rationale per income strategy (HTF bar size determines arrival window):
#   weekly  (HTF=1wk): allow up to 3R -- price often takes weeks to arrive
#   daily   (HTF=1d):  allow up to 2R -- shorter window, tighter cap
#   monthly (HTF=1mo): allow up to 5R -- multi-month positions, wider zones
#   intraday(HTF=60m): allow up to 1.5R -- entries must be very close
# default_max_r is used when income_strategy is missing.
# ------------------------------------------------------------
entry_distance:
  # Primary cap: R-multiples of the stop distance (scales with volatility).
  default_max_r: 3.0
  max_r_to_entry_pending:
    weekly:   3.0
    daily:    2.0
    monthly:  5.0
    intraday: 1.5
  # Secondary cap: raw % distance from current price to entry. Catches the
  # WIDE-zone blind spot of the R cap -- e.g. an equity weekly demand zone so
  # wide that price sitting 23% away is still <3R. A signal is rejected if it
  # exceeds EITHER cap. A weekly income limit waits for a pullback of a few
  # %, not 15-25%; deeper than this is a historical zone, not an approach.
  default_max_pct: 15.0
  max_pct_to_entry:
    weekly:   15.0
    daily:    8.0
    monthly:  25.0
    intraday: 4.0

